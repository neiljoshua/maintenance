<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline for Maintenance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .maintenance-container {
            max-width: 400px;
            padding: 2rem;
        }
        .icon-box {
            width: 48px;
            height: 48px;
            background-color: #e2e8f0;
            border-radius: 12px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-box svg {
            width: 24px;
            height: 24px;
            fill: #64748b;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }
        p {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="icon-box">
            <!-- Simple hexagon/cube icon placeholder -->
            <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/></svg>
        </div>
        <h1>Offline for maintenance</h1>
        <p>This app is undergoing maintenance right now.<br>Please check back later.</p>
    </div>
</body>
</html>
